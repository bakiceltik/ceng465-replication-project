# Lines appended to /etc/postgresql/16/main/pg_hba.conf on the leader.
# Applied by 02_configure_leader.sh.
# Replace FOLLOWER_INTERNAL_IP with the follower VM's internal IP (10.x.x.x).

# Allow replication connection from follower
host    replication     replicator      FOLLOWER_INTERNAL_IP/32    scram-sha-256

# Allow all users to connect from any host (tighten in production)
host    all             all             0.0.0.0/0                  scram-sha-256
