# PostgreSQL leader (primary) settings for CENG465 replication project.
# These lines override defaults in /etc/postgresql/16/main/postgresql.conf.
# Applied by 02_configure_leader.sh via ALTER SYSTEM or direct append.

listen_addresses = '*'
wal_level = replica
max_wal_senders = 5
wal_keep_size = 128
hot_standby = on
synchronous_commit = on
wal_log_hints = on
